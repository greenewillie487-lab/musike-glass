workflows:
  ios-native-glass:
    name: Musike Liquid Glass (unsigned IPA)
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      node: v22.11.0
      vars:
        XCODE_PROJECT: mobile/ios/App/App.xcodeproj
        XCODE_SCHEME: App
    scripts:
      - name: Install pnpm
        script: npm install -g pnpm@10.15.0
      - name: Install JS dependencies
        script: pnpm install --frozen-lockfile
      - name: Build unsigned app
        script: |
          xcodebuild \
            -project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$CM_BUILD_DIR/.derived" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
      - name: Package IPA
        script: |
          APP=$(find "$CM_BUILD_DIR/.derived/Build/Products/Release-iphoneos" -maxdepth 1 -name '*.app' | head -1)
          test -n "$APP"
          cp -R "$CM_BUILD_DIR/mobile/ios/App/public" "$APP/public"
          mkdir -p "$CM_BUILD_DIR/Payload"
          cp -R "$APP" "$CM_BUILD_DIR/Payload/"
          cd "$CM_BUILD_DIR"
          zip -qr Musike-LiquidGlass.ipa Payload
    artifacts:
      - $CM_BUILD_DIR/Musike-LiquidGlass.ipa
      - /tmp/xcodebuild_logs/*.log
