name: Build Liquid Glass IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Show Xcode
        run: xcodebuild -version

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned app
        run: |
          xcodebuild \
            -project MusikeGlass.xcodeproj \
            -scheme MusikeGlass \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath .derived \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package IPA
        run: |
          APP=".derived/Build/Products/Release-iphoneos/MusikeGlass.app"
          test -d "$APP"
          cp -R public "$APP/public"
          mkdir -p Payload
          cp -R "$APP" Payload/MusikeGlass.app
          zip -qr MusikeGlass-LiquidGlass.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: MusikeGlass-LiquidGlass
          path: MusikeGlass-LiquidGlass.ipa
          retention-days: 30
